<div class="login">
  <img
    class="login-background"
    src="https://i.pinimg.com/1200x/2a/5b/23/2a5b23f93f5b34fe2580171018f54f98.jpg"
    alt="fondo">

  <div class="login-card">
    <form class="login-form" #f="ngForm" (ngSubmit)="ingresar()">
      <h2 class="login-title">Iniciar Sesión</h2>

      <input id="usuario" name="usuario" type="text" placeholder="Nombre de usuario"
             [(ngModel)]="usuario" required>

      <input id="contrasena" name="contrasena" type="password" placeholder="Contraseña"
             [(ngModel)]="contrasena" required>

      <a class="link-forgot" routerLink="/forgottenpassword">Olvidé mi contraseña</a>

      @if (mensaje) {
        <p class="mensaje" [class.error]="esError">{{ mensaje }}</p>
      }

      <button type="submit" class="button-login" [disabled]="f.invalid || cargando">
        Ingresar
      </button>

      <p class="register-text">
        ¿No tienes cuenta?
        <a class="sign-up" routerLink="/signup">Regístrate</a>
      </p>
    </form>
  </div>
</div>
<div class="admin-mode">
  <button class="b-admin" routerLink="/admin">Entrar a admin</button>
</div>
<button type="button" class="b-volver" routerLink="/">
  Volver al principal
</button>
