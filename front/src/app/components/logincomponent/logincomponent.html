<div class="login-page">
  <div class="image-panel">
    <img src="https://i.pinimg.com/1200x/37/42/ad/3742ad9ce6271f63f0e2d3a4f8ca7be7.jpg" class="pokemon-image-login" alt="imagen de login">
  </div>
  <div class="form-panel">
    <form class="login-form">
      <h2 class="login-title">Iniciar Sesión</h2>

      <input id="usuario" name="usuario" type="text" placeholder="Nombre de usuario o correo electrónico">
      <input id="contrasena" name="contrasena" type="password" placeholder="Contraseña">

      <a class="link-forgot" routerLink="/forgot-password">Olvide mi contraseña</a>

      <button type="button" class="btn-accept">Ingresar</button>

      <p class="register-text">
        ¿No tienes cuenta?
        <a class="sign-up" routerLink="/signup">Regístrate</a>
      </p>
    </form>
  </div>
</div>
