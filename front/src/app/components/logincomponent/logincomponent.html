<div class="login">
  <img
    class="login-background"
    src="https://i.pinimg.com/1200x/2a/5b/23/2a5b23f93f5b34fe2580171018f54f98.jpg"
    alt="fondo">

  <div class="login-card">
    <form class="login-form">
      <h2 class="login-title">Iniciar Sesión</h2>

      <input id="usuario" name="usuario" type="text" placeholder="Usuario o correo electrónico">

      <input id="contrasena" name="contrasena" type="password" placeholder="Contraseña">

      <a class="link-forgot" routerLink="/forgot-password">Olvidé mi contraseña</a>

      <button type="button" class="button-login">Ingresar</button>

      <p class="register-text">
        ¿No tienes cuenta?
        <a class="sign-up" routerLink="/signup">Regístrate</a>
      </p>
    </form>
  </div>
</div>
<div class="admin-mode">
  <button class="b-admin" routerLink="/admin">Entrar a admin</button>
</div>
<button class="b-volver" routerLink="/">Volver principal</button>
