<div class="change">
  <img
    class="change-background"
    src="https://i.pinimg.com/1200x/2a/5b/23/2a5b23f93f5b34fe2580171018f54f98.jpg"
    alt="Fondo de Pokémon">

  <div class="change-card">
    <form
      class="change-form"
      #f="ngForm"
      (ngSubmit)="cambiarContrasena()">

      <h2 class="change-title">Restablecer contraseña</h2>

      <p class="change-text">
        Ingresa el código que recibiste por correo y crea una contraseña nueva.
      </p>

      <label for="correo">Correo electrónico</label>
      <input
        id="correo"
        name="correo"
        type="email"
        placeholder="Correo electrónico"
        [(ngModel)]="correo"
        required
        email>

      <label for="codigo">Código de verificación</label>
      <input
        id="codigo"
        name="codigo"
        type="text"
        placeholder="Código de 6 dígitos"
        [(ngModel)]="codigo"
        maxlength="6"
        pattern="\d{6}"
        required>

      <label for="nuevaContrasena">Nueva contraseña</label>
      <input
        id="nuevaContrasena"
        name="nuevaContrasena"
        type="password"
        placeholder="Nueva contraseña"
        [(ngModel)]="nuevaContrasena"
        required>

      <label for="confirmarContrasena">Confirmar contraseña</label>
      <input
        id="confirmarContrasena"
        name="confirmarContrasena"
        type="password"
        placeholder="Confirma la nueva contraseña"
        [(ngModel)]="confirmarContrasena"
        required>

      @if (mensaje) {
        <p class="change-text" [class.error]="esError">
          {{ mensaje }}
        </p>
      }

      <button
        type="submit"
        class="button-change"
        [disabled]="f.invalid || cargando">
        {{ cargando ? 'Actualizando...' : 'Cambiar contraseña' }}
      </button>

      <p class="change-text">
        ¿Recordaste tu contraseña?
        <a class="login" routerLink="/login">Inicia sesión</a>
      </p>
    </form>

    <div class="change-image-container">
      <img
        src="/assets/sprites/animated/third_gen/282.gif"
        alt="Gardevoir animado"
        class="side-gif">
    </div>
  </div>
</div>
