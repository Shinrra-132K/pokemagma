<div class="change">
  <img
    class="change-background"
    src="https://i.pinimg.com/1200x/2a/5b/23/2a5b23f93f5b34fe2580171018f54f98.jpg"
    alt="fondo">

  <div class="change-card">
    <form class="change-form">
      <h2 class="change-title">Reestablecer contraseña</h2>
      <p class="change-text">si estás aquí es porque estás intentando reestablecer la contraseña de tu cuenta, crea una contraseña nueva y guardala bien, no la olvides!.</p>

      <input id="nueva-contrasena" name="nuevaContrasena" type="password" placeholder="Nueva contraseña">

      <input id="confirmar-contrasena" name="confirmarContrasena" type="password" placeholder="Confirmar contraseña">

      <button type="button" class="button-change">Cambiar contraseña</button>

      <p class="change-text">
        ¿Recordaste tu contraseña?
        <a class="login" routerLink="/login">Inicia sesión</a>
      </p>
    </form>

    <div class="change-image-container">
      <img src="/assets/sprites/animated/third_gen/282.gif" alt="Pokémon Minun" class="side-gif">
    </div>
  </div>
</div>
