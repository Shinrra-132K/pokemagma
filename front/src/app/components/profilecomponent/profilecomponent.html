@if (abierto) {
  <div class="perfil-overlay" (click)="cerrar.emit()">
    <section
      class="tarjeta-entrenador"
      aria-label="Tarjeta de entrenador"
      (click)="$event.stopPropagation()"
    >
      <div class="tarjeta-interior">
        <header class="cabecera-tarjeta">
          <h2 class="titulo-tarjeta">TRAINER CARD</h2>
          <div class="caja-id">USERNAME: DYNAMIGHTT:D</div>
        </header>

        <div class="cuerpo-tarjeta">
          <div class="datos-entrenador">
            <div class="fila-dato fila-nombre">
              <span class="viñeta-dato" aria-hidden="true"></span>
              <span class="etiqueta-dato">NAME:</span>
              <span class="valor-dato">RED</span>
            </div>

            <div class="separador-nombre"></div>

            <div class="fila-dato">
              <span class="viñeta-dato" aria-hidden="true"></span>
              <span class="etiqueta-dato">MONEY</span>
              <span class="valor-dato valor-derecha">₽161216</span>
            </div>

            <div class="fila-dato">
              <span class="viñeta-dato" aria-hidden="true"></span>
              <span class="etiqueta-dato">POKéDEX</span>
              <span class="valor-dato valor-derecha">20</span>
            </div>

            <div class="fila-dato">
              <span class="viñeta-dato" aria-hidden="true"></span>
              <span class="etiqueta-dato">TIME</span>
              <span class="valor-dato valor-derecha">19:56</span>
            </div>
          </div>

          <div class="zona-entrenador">
            <img
              class="sprite-entrenador"
              src="/assets/sprites/normal/brendan.png"
              alt="Entrenador"
            />
          </div>
        </div>

        <footer class="seccion-pokemon">
          <div class="etiqueta-pokemon">TOP POKéMON</div>
          <div class="rejilla-pokemon" aria-label="Pokémon de mayor nivel">
            <div class="slot-pokemon">
              <span class="nombre-poke-mini">---</span>
              <span class="nivel-poke-mini">Nv.--</span>
            </div>
            <div class="slot-pokemon">
              <span class="nombre-poke-mini">---</span>
              <span class="nivel-poke-mini">Nv.--</span>
            </div>
            <div class="slot-pokemon">
              <span class="nombre-poke-mini">---</span>
              <span class="nivel-poke-mini">Nv.--</span>
            </div>
            <div class="slot-pokemon">
              <span class="nombre-poke-mini">---</span>
              <span class="nivel-poke-mini">Nv.--</span>
            </div>
            <div class="slot-pokemon">
              <span class="nombre-poke-mini">---</span>
              <span class="nivel-poke-mini">Nv.--</span>
            </div>
            <div class="slot-pokemon">
              <span class="nombre-poke-mini">---</span>
              <span class="nivel-poke-mini">Nv.--</span>
            </div>
          </div>
        </footer>
      </div>
    </section>
  </div>
}
