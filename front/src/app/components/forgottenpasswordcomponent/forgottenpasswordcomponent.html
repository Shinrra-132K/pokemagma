<div class="login">
  <img
    class="login-background"
    src="https://i.pinimg.com/1200x/2a/5b/23/2a5b23f93f5b34fe2580171018f54f98.jpg"
    alt="Fondo de Pokémon">

  <div class="login-card">
    <form
      class="login-form"
      #f="ngForm"
      (ngSubmit)="solicitarCodigo()">

      <h2 class="login-title">Recuperar contraseña</h2>

      <label for="correo">Correo electrónico</label>
      <input
        id="correo"
        name="correo"
        type="email"
        placeholder="Ingresa tu correo electrónico"
        [(ngModel)]="correo"
        required
        email>

      @if (mensaje) {
        <p class="mensaje" [class.error]="esError">
          {{ mensaje }}
        </p>
      }

      <button
        type="submit"
        class="button-login"
        [disabled]="f.invalid || cargando">
        {{ cargando ? 'Enviando código...' : 'Enviar código' }}
      </button>

      <p class="register-text">
        ¿Recordaste tu contraseña?
        <a class="sign-up" routerLink="/login">Inicia sesión</a>
      </p>
    </form>

    <div class="login-image-container">
      <img
        src="/assets/sprites/animated/first_gen/054.gif"
        alt="Psyduck animado"
        class="side-gif">
    </div>
  </div>
</div>
